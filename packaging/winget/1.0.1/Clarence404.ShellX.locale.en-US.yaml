ShortDescription: A tiny, pretty terminal and file-transfer client built on Tauri, Rust and React.
Description: |-
  ShellX is a desktop SSH client with tabbed terminals, SFTP and FTP file
  transfer, port forwarding, serial consoles, and a live monitor dashboard
  for the hosts you connect to.

  Saved hosts can be grouped and searched, port forwards are managed in one
  view across every host, and threshold alerts can watch CPU, memory, disk,
  swap and load while the app sits in the background.
