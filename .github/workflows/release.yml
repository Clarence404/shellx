name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.3.1)'
        required: true
        type: string

jobs:
  # Always runs first — creates the GitHub Release with release notes
  # regardless of whether the platform builds succeed. This guarantees
  # a Release page exists even if compilation fails on some runners.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES_FILE="docs/release-notes/${TAG}.md"
          {
            echo "body<<EOF_NOTES"
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              echo
            else
              echo "Auto-built from the tagged commit — release notes file"
              echo "\`$NOTES_FILE\` was not present at build time."
              echo
            fi
            echo "---"
            echo
            echo "Installers below are unsigned — Windows SmartScreen and macOS"
            echo "Gatekeeper will warn on first launch. See the README for the"
            echo "\"Run anyway\" steps until installer signing lands."
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const tag = context.payload.inputs?.tag || context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `shellx ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: false,
              prerelease: false,
            });
            core.setOutput('id', data.id);

  # Platform builds — run in parallel after the release is created.
  # Each uploads its installer artifact to the existing release.
  # continue-on-error keeps the workflow green if a single platform fails.
  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
