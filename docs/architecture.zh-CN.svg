  <title>shellx 架构图</title>
  <desc>两列布局：左侧 React 前端（UI 组件、Zustand 状态、IPC 包装层）；右侧 Rust 后端（tauri command 处理器、SessionManager、protocol、transport、local 模块）；中间 Tauri IPC 通道；底部四个外部资源。</desc>
