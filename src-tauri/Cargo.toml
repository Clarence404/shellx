[package]
name = "shellx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shellx"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Windows dev boxes without NASM can't build the default aws-lc-rs backend
# (aws-lc-sys needs NASM for its assembly routines). Use the pure-Rust `ring`
# backend instead of aws-lc-rs.
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Must match the rand_core major version that ssh-key/signature (russh's
# key crates) pull in, or `PrivateKey::random`'s `CryptoRng` bound fails.
rand = "0.10"
