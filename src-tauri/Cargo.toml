[package]
name = "shellx"
version = "0.8.1"
description = "A Tauri App"
authors = ["Clarence404"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shellx"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes protocol::ssh::testing publicly so integration tests (see Task 11)
# outside this crate can reuse the in-process echo SSH server fixture.
# Pulls in the optional `rand` dep too, since that module needs it and
# out-of-crate integration test binaries build the lib without `cfg(test)`.
test-fixtures = ["dep:rand"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
# Windows dev boxes without NASM can't build the default aws-lc-rs backend
# (aws-lc-sys needs NASM for its assembly routines). Use the pure-Rust `ring`
# backend instead of aws-lc-rs.
russh = { version = "0.62.5", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
# Must match the rand_core major version that ssh-key/signature (russh's
# key crates) pull in, or `PrivateKey::random`'s `CryptoRng` bound fails.
# Optional + gated behind `test-fixtures` so it's not part of the shipped
# binary; pulled in unconditionally for `cfg(test)` builds via dev-dependencies.
rand = { version = "0.10", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5"
# keyring 3.x has no default platform backend: without one of the feature
# flags below it silently falls back to the in-memory mock store (writes
# "succeed" but nothing is ever persisted or readable back). Backend choice
# is per-OS, so it's set via target-specific dependency sections below;
# cargo unions the features declared here with whichever target section
# matches the build platform.
keyring = "3"
tauri-plugin-dialog = "2"
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rand = "0.10"
tempfile = "3"
# russh-sftp 2.x ships both server and client code unconditionally (no
# "server" feature exists to gate) — see russh-sftp/Cargo.toml on crates.io.
# The dev-dependency just documents that the integration test needs it too
# (it's already a normal dependency, but Cargo requires an explicit entry
# to use it from `tests/`).
russh-sftp = "2"

# Integration tests consume the crate from outside, so `#[cfg(test)]` on
# `protocol::ssh::testing` doesn't apply to them — they can only see it
# when the `test-fixtures` feature is enabled. `required-features` here
# tells Cargo to SKIP these tests (instead of failing with "unresolved
# import ::testing") when the feature isn't on, and IDE tooling picks
# up the flag so its analyser stops flagging the imports as broken.
#
# Run them explicitly with:
#   cargo test --features test-fixtures
[[test]]
name = "sftp_integration"
path = "tests/sftp_integration.rs"
required-features = ["test-fixtures"]

[[test]]
name = "ssh_integration"
path = "tests/ssh_integration.rs"
required-features = ["test-fixtures"]

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
